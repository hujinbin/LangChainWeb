# 由容器启动脚本替换 __API_UPSTREAM__ / __PARTNER_UPSTREAM__ 后写入 conf.d。
# 已发布的工作流客户端可能仍使用共享账户路径。仅客户工作台入口标记这六条请求。
map $uri $workflow_account {
    default "";
    ~^/api/user/(login|register|getCode|getUserInfo|editUserInfo|changePassword)/?$ 1;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 反向代理头：透传 Host、协议与真实客户端 IP。
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 5;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto __PUBLIC_SCHEME__;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Partner-Service "";
    proxy_set_header X-Partner-Host "";
    proxy_set_header X-Admin-Site "";
    proxy_set_header X-Workflow-Account $workflow_account;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 运行时配置不缓存，修改后刷新即生效。
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # CRA 构建产物带内容 hash，可长期缓存。
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Platform administration and service-to-service APIs have separate ingress.
    location ~* ^/api/(admin|partner-internal)(/|$) { return 404; }

    location /api/ {
        proxy_pass __API_UPSTREAM__;
        proxy_connect_timeout 15s;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_buffering off;
    }

    location /outputs/ { proxy_pass __API_UPSTREAM__; }

    # 客户站点的旧书签与后台入口都进入本站代理商服务。
    location = /admin { return 302 /partner/; }
    location = /admin/ { return 302 /partner/; }
    location = /admin.html { return 302 /partner/; }
    location ^~ /admin/ { return 404; }

    location = /partner { return 308 /partner/$is_args$args; }
    location /partner/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        try_files $uri $uri/ =404;
    }
    location ~ ^/partner/(api/|healthz$) {
        proxy_pass __PARTNER_UPSTREAM__;
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    __PARTNER_ALIAS__

    # SPA fallback。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
