services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: langchainweb:latest
    container_name: langchainweb
    restart: unless-stopped
    ports:
      # 宿主机 80 → 容器内非 root Nginx 8080。
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-80}:8080"
    environment:
      # 浏览器访问的 API 根地址；留空表示使用同源 /api（由 Nginx 反代）。
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-}"
      # Nginx 反代目标，可指向官方后端或自有后端。
      API_UPSTREAM: "${API_UPSTREAM:-https://jue.leheavengame.com}"
      # 官方入口通过 /partner/api/ 和 /partner/healthz 路由到独立微服务；自建时填写该服务地址。
      PARTNER_UPSTREAM: "${PARTNER_UPSTREAM:-https://jue.leheavengame.com}"
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-}"
      SITE_ID: "${SITE_ID:-}"
      PARTNER_PATH: "${PARTNER_PATH:-/partner/}"
      BRAND_NAME: "${BRAND_NAME:-}"
      LOGO_URL: "${LOGO_URL:-}"
      FAVICON_URL: "${FAVICON_URL:-}"
      DEFAULT_THEME: "${DEFAULT_THEME:-auto}"
      HELP_URL: "${HELP_URL:-}"
      QQ_GROUP: "${QQ_GROUP:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
