services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: langchainweb:latest
    container_name: langchainweb
    restart: unless-stopped
    ports:
      # 宿主机 80 → 容器内非 root Nginx 8080。
      - "80:8080"
    environment:
      # 浏览器访问的 API 根地址；留空表示使用同源 /api（由 Nginx 反代）。
      PUBLIC_API_BASE_URL: ""
      # Nginx 反代目标，可指向官方后端或自有后端。
      API_UPSTREAM: "http://host.docker.internal:3000"
      # 站点后台反代目标，默认与 API 相同。
      ADMIN_UPSTREAM: "http://host.docker.internal:3000"
      SITE_ID: ""
      ADMIN_PATH: "/admin"
      BRAND_NAME: ""
      LOGO_URL: ""
      FAVICON_URL: ""
      DEFAULT_THEME: "auto"
      HELP_URL: ""
      QQ_GROUP: ""
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
